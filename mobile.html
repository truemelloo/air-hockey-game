<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Air Hockey Pro - Mobile & Desktop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background-color: #0d0f18;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 800px;
            padding: 10px;
        }

        #scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }

        .score-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .score {
            font-size: 2rem;
            font-weight: bold;
            font-family: monospace;
        }

        #player-score { color: #00f0ff; text-shadow: 0 0 10px #00f0ff; }
        #ai-score { color: #ff0055; text-shadow: 0 0 10px #ff0055; }

        .player-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }

        #canvas-wrapper {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 240, 255, 0.2);
            border-radius: 16px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #121526;
            cursor: none;
        }

        /* Overlay para Início, Pausa e Fim de Jogo */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 15, 24, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(8px);
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00f0ff, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .overlay p {
            font-size: 1rem;
            color: #ccc;
            margin-bottom: 25px;
            text-align: center;
            padding: 0 20px;
        }

        .btn {
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #00f0ff, #0077ff);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #btn-pause {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            #scoreboard {
                padding: 6px 12px;
                margin-bottom: 6px;
            }
            .score { font-size: 1.5rem; }
            .player-label { font-size: 0.75rem; }
            .overlay h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="scoreboard">
            <div class="score-box">
                <span class="player-label">Você</span>
                <span id="player-score" class="score">0</span>
            </div>
            <button id="btn-pause">Pausa</button>
            <div class="score-box">
                <span id="ai-score" class="score">0</span>
                <span class="player-label">CPU</span>
            </div>
        </div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>

            <!-- Tela Inicial / Pausa -->
            <div id="start-overlay" class="overlay">
                <h1 id="overlay-title">AIR HOCKEY PRO</h1>
                <p id="overlay-desc">Mova o mouse ou deslize o dedo para controlar a raquete.</p>
                <button id="start-btn" class="btn">INICIAR JOGO</button>
            </div>
        </div>
    </div>

    <script>
        // Configuração do Canvas e Contexto
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');

        // Elementos da Interface
        const playerScoreEl = document.getElementById('player-score');
        const aiScoreEl = document.getElementById('ai-score');
        const startOverlay = document.getElementById('start-overlay');
        const startBtn = document.getElementById('start-btn');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const btnPause = document.getElementById('btn-pause');

        // Estados do Jogo
        let isPortrait = false;
        let isPaused = false;
        let gameRunning = false;
        let animationFrameId;

        // Sons com Web Audio API
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(freq, duration, type = 'sine') {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        // Variáveis de Dimensões e Entidades
        let width = 800;
        let height = 500;
        let scale = 1;

        const puck = { x: 0, y: 0, vx: 0, vy: 0, radius: 16, maxSpeed: 18 };
        const player = { x: 0, y: 0, vx: 0, vy: 0, radius: 28, score: 0 };
        const ai = { x: 0, y: 0, vx: 0, vy: 0, radius: 28, score: 0, speed: 6.5 };
        const goal = { size: 160 };

        let particles = [];

        // Redimensionamento Dinâmico e Responsividade
        function resize() {
            const containerW = window.innerWidth * 0.95;
            const containerH = (window.innerHeight - 80) * 0.95;

            isPortrait = window.innerHeight > window.innerWidth && window.innerWidth <= 768;

            let aspectW = isPortrait ? 5 : 8;
            let aspectH = isPortrait ? 8 : 5;

            let w = containerW;
            let h = containerW * (aspectH / aspectW);

            if (h > containerH) {
                h = containerH;
                w = h * (aspectW / aspectH);
            }

            width = w;
            height = h;

            canvas.width = width;
            canvas.height = height;
            scale = width / (isPortrait ? 500 : 800);

            // Redimensionamento proporcional de elementos
            puck.radius = 16 * scale;
            player.radius = 28 * scale;
            ai.radius = 28 * scale;
            goal.size = isPortrait ? width * 0.45 : height * 0.35;

            if (!gameRunning) resetPositions();
        }

        window.addEventListener('resize', resize);

        // Sistema de Partículas para Efeitos Digitais
        function createParticles(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10 * scale,
                    vy: (Math.random() - 0.5) * 10 * scale,
                    radius: Math.random() * 4 + 2,
                    alpha: 1,
                    color: color
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // Reposicionar Elementos no Campo
        function resetPositions() {
            puck.vx = 0;
            puck.vy = 0;
            puck.x = width / 2;
            puck.y = height / 2;

            if (isPortrait) {
                player.x = width / 2;
                player.y = height * 0.8;
                ai.x = width / 2;
                ai.y = height * 0.2;
            } else {
                player.x = width * 0.2;
                player.y = height / 2;
                ai.x = width * 0.8;
                ai.y = height / 2;
            }
        }

        // Controlo do Jogador (Rato e Touch)
        function updatePointer(e) {
            if (isPaused || !gameRunning) return;

            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                // Offset tátil no eixo Y para não tapar a raquete com o dedo
                clientY = e.touches[0].clientY - (isPortrait ? 25 : 10);
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            let targetX = clientX - rect.left;
            let targetY = clientY - rect.top;

            // Restrições de movimento dentro do campo correspondente
            if (isPortrait) {
                player.x = Math.max(player.radius, Math.min(width - player.radius, targetX));
                player.y = Math.max(height / 2 + player.radius, Math.min(height - player.radius, targetY));
            } else {
                player.x = Math.max(player.radius, Math.min(width / 2 - player.radius, targetX));
                player.y = Math.max(player.radius, Math.min(height - player.radius, targetY));
            }
        }

        window.addEventListener('mousemove', updatePointer);
        window.addEventListener('touchmove', updatePointer, { passive: true });
        window.addEventListener('touchstart', updatePointer, { passive: true });

        // IA (Inimigo)
        function updateAI() {
            let targetX, targetY;

            if (isPortrait) {
                targetX = puck.x;
                targetY = puck.y < height / 2 ? puck.y : height * 0.2;
                targetY = Math.min(height / 2 - ai.radius, targetY);
            } else {
                targetX = puck.x > width / 2 ? puck.x : width * 0.8;
                targetY = puck.y;
                targetX = Math.max(width / 2 + ai.radius, targetX);
            }

            // Movimento suave com interpolação
            ai.x += (targetX - ai.x) * 0.08;
            ai.y += (targetY - ai.y) * 0.08;
        }

        // Física e Colisões
        function updatePhysics() {
            puck.x += puck.vx;
            puck.y += puck.vy;

            // Atrito suave do disco
            puck.vx *= 0.985;
            puck.vy *= 0.985;

            // Limite de velocidade máxima
            const currentSpeed = Math.hypot(puck.vx, puck.vy);
            if (currentSpeed > puck.maxSpeed * scale) {
                puck.vx = (puck.vx / currentSpeed) * puck.maxSpeed * scale;
                puck.vy = (puck.vy / currentSpeed) * puck.maxSpeed * scale;
            }

            // Colisão com Paredes Laterais e Golos
            if (isPortrait) {
                if (puck.x - puck.radius <= 0 || puck.x + puck.radius >= width) {
                    puck.vx *= -1;
                    puck.x = puck.x - puck.radius <= 0 ? puck.radius : width - puck.radius;
                    playSound(300, 0.05);
                }

                // Linha de golo Superior (CPU) e Inferior (Jogador)
                const inGoalX = puck.x > (width - goal.size) / 2 && puck.x < (width + goal.size) / 2;

                if (puck.y - puck.radius <= 0) {
                    if (inGoalX) handleGoal('player');
                    else { puck.vy *= -1; puck.y = puck.radius; playSound(300, 0.05); }
                } else if (puck.y + puck.radius >= height) {
                    if (inGoalX) handleGoal('ai');
                    else { puck.vy *= -1; puck.y = height - puck.radius; playSound(300, 0.05); }
                }
            } else {
                if (puck.y - puck.radius <= 0 || puck.y + puck.radius >= height) {
                    puck.vy *= -1;
                    puck.y = puck.y - puck.radius <= 0 ? puck.radius : height - puck.radius;
                    playSound(300, 0.05);
                }

                const inGoalY = puck.y > (height - goal.size) / 2 && puck.y < (height + goal.size) / 2;

                if (puck.x - puck.radius <= 0) {
                    if (inGoalY) handleGoal('ai');
                    else { puck.vx *= -1; puck.x = puck.radius; playSound(300, 0.05); }
                } else if (puck.x + puck.radius >= width) {
                    if (inGoalY) handleGoal('player');
                    else { puck.vx *= -1; puck.x = width - puck.radius; playSound(300, 0.05); }
                }
            }

            // Checagem de colisão com as Raquetes
            checkPaddleCollision(player);
            checkPaddleCollision(ai);
        }

        function checkPaddleCollision(paddle) {
            const dx = puck.x - paddle.x;
            const dy = puck.y - paddle.y;
            const dist = Math.hypot(dx, dy);
            const minDist = puck.radius + paddle.radius;

            if (dist < minDist) {
                const angle = Math.atan2(dy, dx);
                const overlap = minDist - dist;

                puck.x += Math.cos(angle) * overlap;
                puck.y += Math.sin(angle) * overlap;

                const force = 12 * scale;
                puck.vx = Math.cos(angle) * force;
                puck.vy = Math.sin(angle) * force;

                playSound(600, 0.08, 'square');
            }
        }

        function handleGoal(winner) {
            playSound(winner === 'player' ? 800 : 150, 0.4, 'triangle');
            createParticles(puck.x, puck.y, winner === 'player' ? '#00f0ff' : '#ff0055');

            if (winner === 'player') player.score++;
            else ai.score++;

            playerScoreEl.textContent = player.score;
            aiScoreEl.textContent = ai.score;

            if (player.score >= 7 || ai.score >= 7) {
                endGame(winner === 'player' ? "VOCÊ VENCEU!" : "A CPU VENCEU!");
            } else {
                resetPositions();
            }
        }

        // Desenho dos Elementos
        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Marcações do Campo
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.lineWidth = 3;

            ctx.beginPath();
            if (isPortrait) {
                ctx.moveTo(0, height / 2);
                ctx.lineTo(width, height / 2);
                ctx.arc(width / 2, height / 2, width * 0.2, 0, Math.PI * 2);
            } else {
                ctx.moveTo(width / 2, 0);
                ctx.lineTo(width / 2, height);
                ctx.arc(width / 2, height / 2, height * 0.2, 0, Math.PI * 2);
            }
            ctx.stroke();

            // Desenho das Balizas (Golos)
            ctx.lineWidth = 6;
            if (isPortrait) {
                // Golo CPU (Topo)
                ctx.strokeStyle = "#ff0055";
                ctx.beginPath();
                ctx.moveTo((width - goal.size) / 2, 0);
                ctx.lineTo((width + goal.size) / 2, 0);
                ctx.stroke();

                // Golo Jogador (Fundo)
                ctx.strokeStyle = "#00f0ff";
                ctx.beginPath();
                ctx.moveTo((width - goal.size) / 2, height);
                ctx.lineTo((width + goal.size) / 2, height);
                ctx.stroke();
            } else {
                // Golo CPU (Direita)
                ctx.strokeStyle = "#ff0055";
                ctx.beginPath();
                ctx.moveTo(width, (height - goal.size) / 2);
                ctx.lineTo(width, (height + goal.size) / 2);
                ctx.stroke();

                // Golo Jogador (Esquerda)
                ctx.strokeStyle = "#00f0ff";
                ctx.beginPath();
                ctx.moveTo(0, (height - goal.size) / 2);
                ctx.lineTo(0, (height + goal.size) / 2);
                ctx.stroke();
            }

            // Partículas
            drawParticles();

            // Raquetes e Disco
            drawCircle(player.x, player.y, player.radius, '#00f0ff', '#0077ff');
            drawCircle(ai.x, ai.y, ai.radius, '#ff0055', '#990033');
            drawCircle(puck.x, puck.y, puck.radius, '#ffffff', '#aaaaaa');
        }

        function drawCircle(x, y, r, mainColor, strokeColor) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = mainColor;
            ctx.shadowColor = mainColor;
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = strokeColor;
            ctx.stroke();
            ctx.restore();
        }

        // Loop Principal
        function loop() {
            if (gameRunning && !isPaused) {
                updateAI();
                updatePhysics();
                updateParticles();
                draw();
            }
            animationFrameId = requestAnimationFrame(loop);
        }

        // Gestão de Estados
        function startGame() {
            initAudio();
            player.score = 0;
            ai.score = 0;
            playerScoreEl.textContent = '0';
            aiScoreEl.textContent = '0';
            resetPositions();
            gameRunning = true;
            isPaused = false;
            startOverlay.classList.add('hidden');
            btnPause.textContent = "Pausa";
        }

        function togglePause() {
            if (!gameRunning) return;
            isPaused = !isPaused;
            if (isPaused) {
                overlayTitle.textContent = "PAUSADO";
                overlayDesc.textContent = "Clique para continuar o jogo.";
                startBtn.textContent = "CONTINUAR";
                startOverlay.classList.remove('hidden');
                btnPause.textContent = "Retomar";
            } else {
                startOverlay.classList.add('hidden');
                btnPause.textContent = "Pausa";
            }
        }

        function endGame(msg) {
            gameRunning = false;
            overlayTitle.textContent = msg;
            overlayDesc.textContent = "Placar Final: Você " + player.score + " - " + ai.score + " CPU";
            startBtn.textContent = "JOGAR NOVAMENTE";
            startOverlay.classList.remove('hidden');
        }

        // Listeners de Eventos
        startBtn.addEventListener('click', () => {
            if (!gameRunning) startGame();
            else if (isPaused) togglePause();
        });

        btnPause.addEventListener('click', togglePause);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyP' || e.code === 'Space') {
                togglePause();
            }
        });

        // Inicialização
        resize();
        loop();
    </script>
</body>
</html>
